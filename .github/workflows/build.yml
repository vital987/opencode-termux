name: Build OpenCode for Android/Termux (QEMU arm64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'OpenCode version to build'
        required: false
        default: '1.3.13'

env:
  BUN_VERSION: "1.2.13"
  OPENCODE_VERSION: "1.3.13"
  ANDROID_API: "24"
  WEBKIT_COMMIT: "017930ebf915121f8f593bef61cbbca82d78132d"
  TINYCC_COMMIT: "b91835d8701523e895a2b447713630069514e291"
  ICU_VERSION: "75.1"
  # QEMU is slow and memory hungry; keep this low
  JOBS: "3"
  WORK_DIR: "/mnt/spindrive/opencode-build"
  TERMUX_IMAGE: "termux/termux-docker:aarch64"

jobs:
  build:
    name: Build Android aarch64 (emulated)
    runs-on: self-hosted
    timeout-minutes: 2880   # QEMU is 10-30x slower than native/cross

    steps:
      - uses: actions/checkout@v4

      - name: Override OpenCode version from input
        if: github.event.inputs.opencode_version
        run: echo "OPENCODE_VERSION=${{ github.event.inputs.opencode_version }}" >> $GITHUB_ENV

      - name: Create work directory
        run: |
          mkdir -p "$WORK_DIR"
          chmod 777 "$WORK_DIR"
          df -h /mnt/spindrive

      # ---------- Emulation setup ----------
      - name: Register QEMU arm64 binfmt
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Pull Termux arm64 image
        run: docker pull --platform linux/arm64 "$TERMUX_IMAGE"

      - name: Create container runner helper
        run: |
          cat > "$RUNNER_TEMP/tx" <<'EOF'
          #!/usr/bin/env bash
          # usage: tx '<shell command>'
          set -euo pipefail
          exec docker run --rm --platform linux/arm64 \
            --user 0 \
            -v "$WORK_DIR:$WORK_DIR" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e WORK_DIR -e JOBS -e BUN_VERSION -e OPENCODE_VERSION \
            -e ANDROID_API -e WEBKIT_COMMIT -e TINYCC_COMMIT -e ICU_VERSION \
            -e NATIVE_ARM64=1 \
            "$TERMUX_IMAGE" \
            /data/data/com.termux/files/usr/bin/bash -lc "$1"
          EOF
          chmod +x "$RUNNER_TEMP/tx"
          echo "TX=$RUNNER_TEMP/tx" >> $GITHUB_ENV

      - name: Install build dependencies (inside arm64 Termux)
        run: |
          "$TX" '
            pkg update -y &&
            pkg install -y clang cmake ninja make python ruby perl git curl wget \
              unzip xz-utils zip binutils pkg-config libxml2 libxslt \
              golang rust zig autoconf automake libtool \
              glibc-repo glibc-runner
          '

      - name: Install host Bun 1.3.2 (glibc build via grun)
        run: |
          "$TX" '
            HOST_BUN_VERSION=1.3.2
            mkdir -p "$WORK_DIR/host-bun" && cd "$WORK_DIR/host-bun"
            if [ ! -x bun ]; then
              curl -fsSL -o bun.zip \
                "https://github.com/oven-sh/bun/releases/download/bun-v${HOST_BUN_VERSION}/bun-linux-aarch64.zip"
              unzip -oj bun.zip && chmod +x bun && rm bun.zip
            fi
            grun ./bun --version
          '

      # ---------- Cache ----------
      - name: Compute patch hashes
        id: hashes
        run: |
          echo "bun_patch_hash=$(sha256sum patches/bun/android-support.patch | cut -c1-16)" >> $GITHUB_OUTPUT
          echo "webkit_patch_hash=$(sha256sum patches/webkit/android-support.patch | cut -c1-16)" >> $GITHUB_OUTPUT
          echo "zig_patch_hash=$(sha256sum patches/zig/posix-android-sigaction.patch | cut -c1-16)" >> $GITHUB_OUTPUT

      - name: Cache ICU build
        id: cache-icu
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/deps-android/prefix
          key: icu-android-qemu-${{ env.ICU_VERSION }}-${{ env.ANDROID_API }}

      - name: Cache WebKit build
        id: cache-webkit
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/webkit-android
          key: webkit-android-qemu-${{ env.WEBKIT_COMMIT }}-${{ steps.hashes.outputs.webkit_patch_hash }}

      - name: Cache Bun binary
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/bun-build/bun
          key: bun-android-qemu-${{ env.BUN_VERSION }}-${{ steps.hashes.outputs.bun_patch_hash }}-${{ steps.hashes.outputs.zig_patch_hash }}

      # ---------- Build (all inside emulated arm64) ----------
      - name: Clone and patch Bun + WebKit
        if: steps.cache-bun.outputs.cache-hit != 'true' || steps.cache-webkit.outputs.cache-hit != 'true'
        run: '"$TX" "source scripts/env.sh && ./scripts/apply-patches.sh"'

      - name: Build ICU
        if: steps.cache-icu.outputs.cache-hit != 'true'
        run: '"$TX" "source scripts/env.sh && ./scripts/build-icu.sh"'

      - name: Build WebKit/JSC
        if: steps.cache-webkit.outputs.cache-hit != 'true'
        run: '"$TX" "source scripts/env.sh && ./scripts/build-webkit.sh"'

      - name: Build TinyCC
        if: steps.cache-bun.outputs.cache-hit != 'true'
        run: '"$TX" "source scripts/env.sh && ./scripts/build-tinycc.sh"'

      - name: Build Bun
        if: steps.cache-bun.outputs.cache-hit != 'true'
        run: |
          "$TX" '
            source scripts/env.sh
            [ -d "$BUN_SRC/.git" ] || ./scripts/apply-patches.sh
            ./scripts/build-bun.sh
          '

      - name: Verify Bun binary
        run: |
          B="${WORK_DIR}/bun-build/bun"
          ls -lh "$B"; file "$B"; readelf -h "$B" | grep -E "Machine|Class"

      - name: Build libopentui.so
        run: '"$TX" "source scripts/env.sh && ./scripts/build-opentui.sh"'

      - name: Build OpenCode standalone binary
        run: '"$TX" "source scripts/env.sh && ./scripts/build-opencode.sh"'

      - name: Verify OpenCode binary
        run: |
          B="${WORK_DIR}/dist/opencode"
          ls -lh "$B"; file "$B"; readelf -h "$B" | grep -E "Machine|Class"

      - name: Create distribution packages
        run: '"$TX" "source scripts/env.sh && ./scripts/make-packages.sh"'

      - name: List packages
        run: ls -lh "${WORK_DIR}/packages/"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-${{ env.OPENCODE_VERSION }}
          path: |
            ${{ env.WORK_DIR }}/packages/*.zip
            ${{ env.WORK_DIR }}/packages/*.pkg.tar.xz
            ${{ env.WORK_DIR }}/packages/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.WORK_DIR }}/packages/*.zip
            ${{ env.WORK_DIR }}/packages/*.pkg.tar.xz
            ${{ env.WORK_DIR }}/packages/*.deb
          body: |
            ## OpenCode ${{ env.OPENCODE_VERSION }} for Android/Termux (aarch64)
            Built natively under QEMU arm64 emulation (Termux userland).

            - Bun: v${{ env.BUN_VERSION }}
            - WebKit/JSC: ${{ env.WEBKIT_COMMIT }}
            - ICU: ${{ env.ICU_VERSION }}
            - Android API level: ${{ env.ANDROID_API }}

      - name: Cleanup intermediate files
        if: always()
        run: |
          rm -rf "${WORK_DIR}"/{bun-src,webkit-src,opentui-src,opencode-src}
          rm -rf "${WORK_DIR}"/{icu-src,icu-android-build,webkit-build}
          rm -rf "${WORK_DIR}/bun-build/cache/zig"
          df -h /mnt/spindrive
